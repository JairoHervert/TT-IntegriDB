# TT 2026-B143 - servicios
#
# Por ahora solo existe el servicio "db": el "Servidor SQL" (no confiable)
# de la arquitectura del reporte, cargado con el caso de estudio de
# registros academicos. Los servicios "prover" y "verifier" se agregaran
# aqui cuando exista su codigo y su Dockerfile (carpetas prover/ y
# verifier/); desde la red interna de Docker se conectaran a este
# servicio por su nombre, "db".
#
# Levantar:   docker compose up -d
# Estado:     docker compose ps        (esperar "healthy")
# Logs:       docker compose logs -f db
# Reiniciar desde cero (borra datos y vuelve a ejecutar academic_records_db/init/):
#             docker compose down -v && docker compose up -d
#
# "name" fija el nombre del proyecto de Compose (prefijo de volumen/red),
# para que NO dependa de como se llame la carpeta local (TT_Code, la que
# resulte de "git clone", etc.). Sin esto, el volumen se llamaria distinto
# segun el nombre de la carpeta y los comandos de limpieza de
# academic_records_db/tools/USAGE.txt dejarian de coincidir.
name: tt-integridb

services:
  db:
    image: mysql:8.4
    container_name: tt_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_tt_2026
      MYSQL_DATABASE: academic_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass_2026
      TZ: America/Mexico_City
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Acceso desde la VM mientras prover/verifier corren fuera de Docker.
      # Cuando sean contenedores en este archivo, usaran el host "db".
      - "127.0.0.1:3306:3306"
    volumes:
      - tt_db_data:/var/lib/mysql
      # Se ejecuta una sola vez, en orden alfabetico, solo si el volumen esta vacio.
      - ./academic_records_db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_tt_2026"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tt_db_data:
